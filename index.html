<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <div class="text-center mb-5">
        <h1>Student Results Management</h1>
        <p class="text-muted">Manage student grades and results easily</p>
    </div>

    <div class="card shadow p-4 mb-4">

        <h4 class="mb-4">Add New Student</h4>

        <div class="mb-3">
            <label class="form-label">Student Name</label>
            <input type="text" id="studentName"
                   class="form-control" placeholder="Enter student name">
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Subject 1</label>
                <input type="number" id="grade1" class="form-control"
                       placeholder="Grade">
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Subject 2</label>
                <input type="number" id="grade2" class="form-control"
                       placeholder="Grade">
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Subject 3</label>
                <input type="number" id="grade3" class="form-control"
                       placeholder="Grade">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Attendance Percentage</label>
            <input type="number" id="attendance"
                   class="form-control" placeholder="0 - 100">
        </div>

        <div id="errorMessage" class="alert alert-danger d-none"></div>

        <button id="addStudent" class="btn btn-primary w-100 mb-3">
            Add Student
        </button>

        <button id="graceCommittee" class="btn btn-success w-100">
            Activate Grace Committee
        </button>

    </div>

    <div class="card shadow p-4 mb-4">
        <h4>Students List</h4>
        <ul id="studentsDisplay" class="list-group mt-3">
        </ul>
    </div>

    <div class="card shadow p-4">
        <h4>Final Report</h4>
        <div id="finalReport" class="mt-3">
            <p class="text-muted">No report available yet.</p>
        </div>
    </div>

</div>

<script src="main.js"></script>

</body>
</html>
